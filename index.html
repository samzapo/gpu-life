<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complex Life · Earth Wind &amp; Ocean Currents</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <canvas id="bgCanvas"></canvas>
    <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <clipPath id="sphereClip">
          <path id="sphereClipPath" />
        </clipPath>
      </defs>
      <g clip-path="url(#sphereClip)" fill="none">
        <path id="graticulePath" stroke="rgba(140, 165, 190, 0.25)" stroke-width="0.8" />
        <path id="hemispherePath" stroke="rgba(165, 190, 215, 0.34)" stroke-width="1.0" />
        <path id="coastlinePath" stroke="rgba(245, 248, 255, 0.82)" stroke-width="1.15" />
        <path id="lakesPath" stroke="rgba(220, 232, 245, 0.62)" stroke-width="0.95" />
      </g>
      <path id="sphereRimPath" fill="none" />
    </svg>
    <canvas id="oceanCanvas"></canvas>
    <canvas id="windCanvas"></canvas>
    <canvas id="canvas"></canvas>

    <div id="controls">
      <div id="hudHeader">
        <span id="hudTitle">Wind &amp; Ocean</span>
        <button id="hudToggleBtn" type="button" aria-expanded="true" aria-label="Minimize display">−</button>
      </div>
      <div id="hudBody">
        <div id="windHudGroup">
          <div id="earthMeta" class="hudMetaRow">
            <span id="windLevelBadge">Wind @ Sfc (10m)</span>
            <span id="windTimeBadge">GFS · loading…</span>
          </div>
          <div id="scaleWrap" class="hudScaleWrap">
            <span class="scaleTick">0</span>
            <div id="scaleBar" class="scaleBar"></div>
            <span id="scaleMaxLabel" class="scaleTick">100 m/s</span>
          </div>
        </div>
        <div id="oceanHudGroup">
          <div id="oceanMeta" class="hudMetaRow">
            <span id="oceanLevelBadge">Ocean @ Sfc Currents</span>
            <span id="oceanTimeBadge">NOAA CoastWatch · loading…</span>
          </div>
          <div id="oceanScaleWrap" class="hudScaleWrap">
            <span class="scaleTick">0</span>
            <div id="oceanScaleBar" class="scaleBar"></div>
            <span id="oceanScaleMaxLabel" class="scaleTick">1.5 m/s</span>
          </div>
        </div>
        <p>
          Drag — rotate · Scroll / Pinch — zoom<br>
          Shift / Alt / Tool — attract &amp; repel
        </p>
      </div>
    </div>

    <a id="githubBtn" href="https://github.com/samzapo/gpu-life" target="_blank"></a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
