<div id="synth-spec" aria-label="Synth Spectrogram">
  <canvas id="synth-spec-canvas"></canvas>
  <div class="synth-spec-controls">
    <input
      id="synth-stream-toggle"
      type="checkbox"
      checked
      aria-label="Toggle wind and water streamline synth effect"
      title="Toggle wind &amp; water streamline synth effect"
    />
    <button
      id="synth-spec-toggle"
      type="button"
      aria-expanded="true"
      aria-label="Minimize synth spectrogram"
      title="Minimize synth spectrogram"
    >−</button>
  </div>
</div>
<div id="synth-spec-tooltip" role="tooltip" hidden></div>

<div id="webgpu-notice" role="status" hidden>
  <span id="webgpu-notice-text"></span>
  <button id="webgpu-notice-close" type="button" aria-label="Dismiss notice">×</button>
</div>

<div id="globe-switches" aria-label="Globe modes">
  <button
    id="game-toggle"
    class="game-switch"
    type="button"
    aria-pressed="false"
  >
    <span aria-hidden="true">◷</span> Game mode
  </button>
  <button
    id="tour-toggle"
    class="game-switch"
    type="button"
    aria-pressed="false"
    title="Orbit the globe and follow colonies"
  >
    <span aria-hidden="true">◎</span> Globe tour
  </button>
  <button
    id="music-toggle"
    class="game-switch"
    type="button"
    aria-pressed="false"
    title="Dark cyberpunk synth driven by globe life, chemistry, minerals & weather at screen center"
  >
    <span aria-hidden="true">♪</span> Synth
  </button>
  <output id="tour-caption" hidden></output>
</div>

<canvas id="swipe-canvas" aria-hidden="true"></canvas>
<div id="event-marker" hidden aria-hidden="true"><i></i></div>

<div id="cyber-hud" hidden aria-live="polite">
  <div id="cyber-kicker"></div>
  <div id="cyber-main"></div>
  <div id="cyber-sub"></div>
</div>

<section id="temporal-panel" hidden aria-label="Event progress">
  <div class="cyber-bar-meta">
    <div class="cyber-left">
      <div id="attempt-pips" aria-label="Attempts">
        <i></i><i></i><i></i>
      </div>
      <span id="game-status-tag">SCANNING</span>
    </div>
    <div class="cyber-right">
      <span id="survivor-readout" hidden></span>
      <span id="event-clock">0.0s</span>
      <strong id="game-score" title="Points earned">0 PTS</strong>
    </div>
  </div>
  <div class="timeline-wrap">
    <div id="plan-track"></div>
    <div id="progress-fill"></div>
    <input
      type="range"
      id="game-timeline"
      min="0"
      max="100"
      value="0"
      step="1"
      disabled
      tabindex="-1"
      aria-label="Progress through event"
    />
  </div>
</section>
